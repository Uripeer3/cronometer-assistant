name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d8b7881df0226f9e82c39688e
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra mcp --extra live --group dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check --diff .
      - name: Unit and MCP round-trip tests
        run: uv run --locked --extra mcp --extra live python -m unittest discover -s tests -v
      - name: Tunnel launcher compatibility
        env:
          TUNNEL_RELEASE_API_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python - <<'PY'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from scripts.run_tunnel import acquire_client, launch_arguments
          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              client = acquire_client(root)
              command = launch_arguments(
                  client,
                  'tunnel_' + 'a' * 32,
                  Path(sys.executable),
                  root / 'assistant.sqlite',
                  root / 'session.json',
                  root / 'health.url',
              )
              subprocess.run([*command, '--help'], check=True)
          PY
