name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUIRE_MCP_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra mcp --group dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check --diff .
      - name: Domain and real MCP transport tests
        run: uv run --locked --extra mcp python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: uv run --locked cronometer-assistant demo
      - name: Official tunnel CLI compatibility
        run: |
          uv run --locked python - <<'PY'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from scripts.connect_demo import acquire_client, launch_arguments
          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              client = acquire_client(root)
              subprocess.run([str(client), 'help', 'quickstart'], check=True)
              command = launch_arguments(client, 'tunnel_' + 'a' * 32,
                                         Path(sys.executable), root / 'demo.sqlite')
              subprocess.run([*command, '--help'], check=True)
          PY

